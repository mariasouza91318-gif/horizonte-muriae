<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Horizonte - Contato</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        horizonteBlue: '#0f2454',
                        horizonteOrange: '#f97316'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Cabeçalho -->
    <header class="bg-horizonteBlue text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-2 mb-4 md:mb-0">
                <span class="text-2xl font-bold tracking-wider">Portal <span class="text-horizonteOrange">Horizonte</span></span>
            </div>
            <nav class="flex space-x-6 text-sm font-medium">
                <a href="index.html" class="hover:text-horizonteOrange transition">Início</a>
                <a href="nossa-historia.html" class="hover:text-horizonteOrange transition">Nossa História</a>
                <a href="codigo-etica.html" class="hover:text-horizonteOrange transition">Código de Ética</a>
                <a href="contato.html" class="text-horizonteOrange border-b-2 border-horizonteOrange pb-1 transition">Contato</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow container mx-auto px-4 py-12 max-w-3xl">
        <h1 class="text-3xl md:text-4xl font-bold text-horizonteBlue mb-2 border-l-4 border-horizonteOrange pl-3">Contato</h1>
        <p class="text-gray-600 mb-8">Tem alguma sugestão, dúvida ou pauta? Envie sua mensagem para nossa equipe.</p>

        <div class="bg-white rounded-xl shadow-md p-6 md:p-10">
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="nome" class="block text-sm font-semibold text-horizonteBlue mb-2">Seu Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-horizonteOrange">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-horizonteBlue mb-2">Seu E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-horizonteOrange">
                </div>

                <div>
                    <label for="assunto" class="block text-sm font-semibold text-horizonteBlue mb-2">Assunto</label>
                    <input type="text" id="assunto" name="assunto" required placeholder="Sobre o que deseja falar?" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-horizonteOrange">
                </div>

                <div>
                    <label for="mensagem" class="block text-sm font-semibold text-horizonteBlue mb-2">Envie sua Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem detalhadamente aqui..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-horizonteOrange"></textarea>
                </div>

                <button type="submit" class="w-full bg-horizonteOrange text-white font-bold py-3 px-6 rounded-lg hover:bg-orange-600 transition shadow-md">
                    Enviar Mensagem
                </button>
            </form>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-horizonteBlue text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-lg font-bold mb-2">Portal <span class="text-horizonteOrange">Horizonte</span></p>
            <p class="text-sm text-gray-300">&copy; 2026 Portal Horizonte. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
